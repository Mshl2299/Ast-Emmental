<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ast-Emmental - A game by Marcus Lim</title>
    <meta name="description"
        content="Welcome to Ast-Emmental Mining Co. Collect precious space minerals, avoid dangerous Asteroids, and seek the greatest Score!">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="menus.css">
    <!-- <link rel="stylesheet" href="" class="mobileCSS"> -->
    <link rel="icon" type="image/png" href="assets/sprites/shipAlpha.png">

</head>

<body style="background-color: #33758a;">
    <div class="canvas-container">
        <canvas id="canvas" oncontextmenu="return false">Your browser does not support HTML Canvas</canvas>
        <img src="assets/backgrounds/blueSpace.jpg" alt="Background" class="background-img">
        <div class="title-splash">
            <img src="assets/images/AstEmmentalTitle.png" alt="Ast-Emmental" class="title">
            <p style="letter-spacing: -1px; font-size: 20px;">Welcome to AST-Emmental Mining Co.</p>
        </div>
        <!--Middle Left/Right Buttons-->
        <div class="score-anchor">
            <button class="right-hex-button">◀</button>
            <div class="score-display">
                <h6 class="highscore-title"><u>GLOBAL HIGHSCORES</u></h6>
                <div class="score-list global-scores"></div>
                <hr>
                <h6 class="highscore-title"><u>LOCAL HIGHSCORES</u></h6>
                <div class="score-list local-scores"></div>
            </div>
        </div>
        <button class="left-hex-button">▶</button>
        <!--end game first screen-->
        <div class="end-game-first-text fs32 hidden">
            <p>End the current game first!</p>
        </div>
        <!--start game-->
        <button class="start-button" oncontextmenu="return false">START</button>
        <!--game over screen-->
        <div class="game-over-screen fs32 hidden">
            <h4><u>GAME OVER</u></h4>
            <h5>FINAL SCORE: <span id="final-score-display"></span></h5>
            <form id="score-form">
                <input type="text" id="username" placeholder="NAME" maxlength="12" autocomplete="off" autocorrect="off"
                    autocapitalize="off" spellcheck="false">
                <button type="submit" id="leaderboard-submit">Submit</button>
            </form>
        </div>

        <!--Buttons on upper left side-->
        <div class="buttons-flex1" oncontextmenu="return false">
            <button class="how-to-button">HOW TO</button>
            <button class="music-button">MUSIC</button>
        </div>
        <!--How To Play-->
        <div id="how-to-mount"></div>

        <!--Buttons on right side-->
        <div class="buttons-flex2" oncontextmenu="return false">
            <button class="device-button greyed"><img src="assets/images/desktop.png" class="small-icon"></button>
            <button class="skins-button">SKINS</button>
            <button class="audio-button"><img src="assets/images/musicUnmuted.jpg" class="small-icon"></button>
            <button class="close-button fs32">X</button>
        </div>
        
        <div id="skins-mount"></div>
        <div id="music-mount"></div>
        <!--Audio Menu-->
        <div class="audio-menu fs32 hidden">
            <div class="flex">
                <div class="flex"><img src="assets/images/audioUnmuted.png" class="small-icon border sfx-toggle-button">
                </div>
                <div class="flex"><img src="assets/images/musicUnmuted.jpg"
                        class="small-icon border music-toggle-button"></div>
            </div>
            </br>
            <div class="flex">
                <div class="flex container">
                    <input type="range" min="0" max="100" value="100" class="slider" id="sfx-range">
                </div>
                <div class="flex container">
                    <input type="range" min="0" max="100" value="50" class="slider" id="music-range">
                </div>
            </div>
            </br>
            <h6 class="reset-data-button">RESET DATA</h6>
        </div>
        <!--End of Canvas Container div-->
    </div>
    <script src="scripts/main.js" type="module"></script>
</body>

</html>
